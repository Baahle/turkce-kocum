<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Türkçe Koçum</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:#0b1020;color:#f7f8fb}
    .app{max-width:720px;margin:auto;min-height:100vh;padding:18px}
    .top{display:flex;justify-content:space-between;align-items:center}
    .badge{background:#1e293b;padding:7px 11px;border-radius:20px}
    .hero{margin:18px 0;background:#121a2d;border:1px solid #273451;
      border-radius:24px;padding:20px;text-align:center}
    .avatar{width:145px;height:145px;margin:auto;border-radius:50%;
      background:#263654;display:grid;place-items:center;font-size:72px}
    .hero h1{margin:14px 0 3px}
    .hero p{color:#b8c1d6;margin:5px}
    .card{background:#121a2d;border:1px solid #273451;
      border-radius:18px;padding:15px;margin:12px 0}
    .messages{height:280px;overflow:auto}
    .msg{padding:11px 13px;border-radius:15px;margin:9px 0;
      max-width:88%;line-height:1.4}
    .ece{background:#202d4a}
    .me{background:#394a75;margin-left:auto}
    .help{font-size:13px;color:#a9e8bd;margin:4px 4px 12px}
    .controls{display:flex;gap:8px}
    input{flex:1;min-width:0;border:1px solid #34415e;background:#0d1425;
      color:white;border-radius:14px;padding:13px;font-size:16px}
    button{border:0;border-radius:14px;padding:12px 14px;
      background:#e64b45;color:white;font-weight:700}
    .mic{background:#243654}
    .scenarios{display:flex;gap:7px;overflow:auto}
    .scenarios button{white-space:nowrap;background:#1f2c49}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);
      gap:8px;text-align:center}
    .stats b{display:block;font-size:20px}
    .small{font-size:12px;color:#aeb8cd}
  </style>
</head>

<body>
<main class="app">

  <div class="top">
    <strong>🇹🇷 Türkçe Koçum</strong>
    <span class="badge" id="level">Niveau A1</span>
  </div>

  <section class="hero">
    <div class="avatar">👩🏻</div>
    <h1>Ece</h1>
    <p>Ton coach personnel de turc</p>
    <p class="small">Je m'adapte progressivement à ton niveau.</p>
  </section>

  <div class="scenarios">
    <button onclick="scenario('cafe')">☕ Café</button>
    <button onclick="scenario('voyage')">✈️ Voyage</button>
    <button onclick="scenario('rencontre')">👋 Rencontre</button>
    <button onclick="scenario('travail')">💼 Travail</button>
  </div>

  <section class="card messages" id="messages">
    <div class="msg ece">Merhaba! Ben Ece. Bugün nasılsın?</div>
    <div class="help">Bonjour ! Je suis Ece. Comment vas-tu aujourd'hui ?</div>
  </section>

  <div class="controls">
    <button class="mic" id="mic">🎙️</button>
    <input id="input" placeholder="Türkçe yaz veya konuş…">
    <button id="send">➤</button>
  </div>

  <section class="card stats">
    <div><b id="xp">0</b><span class="small">XP</span></div>
    <div><b id="phrases">0</b><span class="small">phrases</span></div>
    <div><b>1</b><span class="small">jour</span></div>
  </section>

  <p class="small" id="status">
    Mode démo • aucune clé API nécessaire
  </p>

</main>

<script>
const messages = document.querySelector("#messages");
const input = document.querySelector("#input");
let count = Number(localStorage.getItem("count") || 0);

function add(text,type="ece"){
  const d=document.createElement("div");
  d.className="msg "+type;
  d.textContent=text;
  messages.appendChild(d);
  messages.scrollTop=messages.scrollHeight;
}

function help(text){
  const d=document.createElement("div");
  d.className="help";
  d.textContent=text;
  messages.appendChild(d);
}

function speak(text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="tr-TR";
  speechSynthesis.speak(u);
}

function answer(text){
  const t=text.toLocaleLowerCase("tr");

  let response="Güzel! Biraz daha anlatır mısın?";
  let correction="Très bien. Essaie maintenant de faire une phrase un peu plus longue.";

  if(t.includes("merhaba") || t.includes("selam")){
    response="Merhaba! Tanıştığımıza memnun oldum. Adın ne?";
    correction="« Tanıştığımıza memnun oldum » signifie « enchantée ».";
  }

  else if(t.includes("iyiyim") || t.includes("iyi")){
    response="Harika! Bugün ne yapmak istiyorsun?";
    correction="Très bien : « İyiyim » signifie « Je vais bien ».";
  }

  else if(t.includes("adım")){
    response="Memnun oldum! Nerede yaşıyorsun?";
    correction="Très bien. « Adım … » est une façon naturelle de donner ton prénom.";
  }

  else if(t.includes("teşekkür")){
    response="Rica ederim! Türkçe konuşmaya devam edelim.";
    correction="Parfait : « Teşekkür ederim » est très naturel.";
  }

  add(response);
  help(correction);
  speak(response);

  count++;
  localStorage.setItem("count",count);

  document.querySelector("#xp").textContent=count*10;
  document.querySelector("#phrases").textContent=count;

  if(count>=8){
    document.querySelector("#level").textContent="Niveau A2";
  }
}

function send(){
  const text=input.value.trim();
  if(!text) return;

  add(text,"me");
  input.value="";

  setTimeout(()=>answer(text),250);
}

document.querySelector("#send").onclick=send;

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});

function scenario(type){
  const lines={
    cafe:"Bir kahve almak istiyorum. Sen ne içersin?",
    voyage:"İstanbul'a hoş geldin! Nereye gitmek istiyorsun?",
    rencontre:"Merhaba! Kendini tanıtır mısın?",
    travail:"Ne iş yapıyorsun?"
  };

  add(lines[type]);
  speak(lines[type]);
}

    document.query
